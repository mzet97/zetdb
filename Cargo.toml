[package]
name = "zetdb"
version = "0.1.0"
edition = "2021"
description = "High-performance in-memory key-value store inspired by Redis, implemented in Rust"
license = "MIT"
repository = "https://github.com/mzet97/zetdb"
readme = "README.md"
keywords = ["redis", "kv-store", "database", "in-memory", "async"]
categories = ["database-implementations", "network-programming"]
exclude = ["docs/", "target/", ".github/", "benches/"]

[lib]
name = "zetdb"
path = "src/lib.rs"

[[bin]]
name = "zetdb"
path = "src/main.rs"

[dependencies]
tokio = { version = "1.52.3", features = ["full"] }
bytes = "1.12.0"
dashmap = "6.2.1"
log = "0.4.33"
env_logger = "0.11.11"
memchr = "2.8.2"
crc32fast = "1.5.0"
itoa = "1.0.18"
memmap2 = "0.9.5"
libc = "0.2"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
clap = { version = "4.6.1", features = ["derive", "env"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true

[lints.clippy]
manual_is_multiple_of = "allow"
